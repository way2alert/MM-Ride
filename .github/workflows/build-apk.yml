name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build MM Ride Driver APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'driver-app/package-lock.json'

      - name: 📦 Install Driver App Dependencies
        working-directory: ./driver-app
        run: npm ci

      - name: ⚙️ Expo Prebuild (Generate Native Android Project)
        working-directory: ./driver-app
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Standalone APK with Gradle
        working-directory: ./driver-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MM-Ride-Driver-Debug-APK
          path: driver-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
